<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="sp-border" style="border-bottom:1px solid #E4ECE9;">
  <tr>
    <td style="padding:20px 34px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
          <td align="left" class="sp-brand sp-text" style="font-family:Manrope,Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;color:#152B2A;">
            {% if logo_url %}
              <img src="{{ logo_url }}" width="132" alt="SurePlace" class="sp-logo" style="display:block;border:0;max-width:132px;height:auto;padding:8px;background:#FFFFFF;border-radius:6px;color:#152B2A;">
            {% else %}
              <span class="sp-accent" style="color:#087D69;">Sure</span><span class="sp-text" style="color:#152B2A;">Place</span>
            {% endif %}
          </td>
          <td class="sp-tagline sp-muted" align="right" style="font-size:13px;color:#647471;">Property. Without the noise.</td>
        </tr>
      </table>
    </td>
  </tr>
</table>

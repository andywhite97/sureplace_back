{% if status == "success" %}
  <div class="sp-accent sp-status-success" style="width:44px;height:44px;border-radius:22px;background:#E8F6F3;color:#087D69;text-align:center;line-height:44px;font-size:20px;font-weight:800;">&#10003;</div>
{% elif status == "warning" %}
  <div class="sp-status-warning" style="width:44px;height:44px;border-radius:22px;background:#FFF6E7;color:#99600B;text-align:center;line-height:44px;font-size:20px;font-weight:800;">!</div>
{% elif status == "error" %}
  <div class="sp-status-error" style="width:44px;height:44px;border-radius:22px;background:#FDECEC;color:#C73939;text-align:center;line-height:44px;font-size:20px;font-weight:800;">&times;</div>
{% else %}
  <div class="sp-status-info" style="width:44px;height:44px;border-radius:22px;background:#EAF2FB;color:#2368B5;text-align:center;line-height:44px;font-size:20px;font-weight:800;">i</div>
{% endif %}

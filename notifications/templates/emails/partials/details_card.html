{% if details %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="sp-surface sp-border" style="margin:22px 0 0 0;background:#F6F9F8;border:1px solid #E4ECE9;border-radius:12px;">
  {% for item in details %}
    <tr>
      <td class="sp-detail-label sp-muted sp-border" style="padding:13px 16px;border-bottom:1px solid #E4ECE9;font-size:14px;line-height:20px;color:#647471;">{{ item.label }}</td>
      <td class="sp-detail-value sp-text sp-border" align="right" style="padding:13px 16px;border-bottom:1px solid #E4ECE9;font-size:14px;line-height:20px;color:#152B2A;font-weight:800;word-break:break-word;overflow-wrap:anywhere;">{% if item.label == "Total" %}<span class="sp-accent" style="color:#087D69;">{{ item.value }}</span>{% else %}{{ item.value }}{% endif %}</td>
    </tr>
  {% endfor %}
</table>
{% endif %}

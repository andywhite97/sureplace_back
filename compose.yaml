services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: sureplace_test
      POSTGRES_USER: sureplace
      POSTGRES_PASSWORD: sureplace
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sureplace -d sureplace_test"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

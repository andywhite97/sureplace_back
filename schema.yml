        * `PENDING` - Pending
        * `CONFIRMED` - Confirmed
        * `DECLINED` - Declined
        * `CANCELLED` - Cancelled
        * `COMPLETED` - Completed
        * `RESCHEDULE_REQUESTED` - Reschedule requested

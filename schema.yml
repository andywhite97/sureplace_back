components:
  schemas:
    AgencySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        logo:
          type: string
          format: uri
        verification_status:
          type: string
      required:
      - id
      - logo
      - name
      - slug
      - verification_status
    AgentSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          readOnly: true
        whatsapp_number:
          type: string
        verification_status:
          type: string
      required:
      - id
      - name
      - verification_status
      - whatsapp_number
    Amenity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        icon:
          type: string
          maxLength: 100
        category:
          type: string
          maxLength: 100
      required:
      - id
      - name
      - slug
    AvailabilityStatusEnum:
      enum:
      - AVAILABLE
      - UNDER_OFFER
      - UNAVAILABLE
      - UNKNOWN
      type: string
      description: |-
        * `AVAILABLE` - Available
        * `UNDER_OFFER` - Under offer
        * `UNAVAILABLE` - Unavailable
        * `UNKNOWN` - Unknown
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        stay_name:
          type: string
          readOnly: true
        room_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        reference:
          type: string
          readOnly: true
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        adults:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        children:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        rooms:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        nightly_pricing:
          readOnly: true
        nightly_subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        taxes:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        fees:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        payment_status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatusEnum'
          readOnly: true
        guest_name:
          type: string
          maxLength: 200
        guest_email:
          type: string
          format: email
          maxLength: 254
        guest_phone:
          type: string
          maxLength: 20
        special_requests:
          type: string
        idempotency_key:
          type: string
          nullable: true
          maxLength: 100
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        confirmed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        stay:
          type: string
          format: uuid
          readOnly: true
        room_type:
          type: string
          format: uuid
        guest:
          type: string
          format: uuid
          readOnly: true
        conversation:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - adults
      - cancelled_at
      - check_in
      - check_out
      - completed_at
      - confirmed_at
      - conversation
      - created_at
      - currency
      - expires_at
      - fees
      - guest
      - guest_email
      - guest_name
      - id
      - nightly_pricing
      - nightly_subtotal
      - payment_status
      - reference
      - room_name
      - room_type
      - rooms
      - status
      - stay
      - stay_name
      - taxes
      - total
      - updated_at
    BookingStatusEnum:
      enum:
      - PENDING
      - CONFIRMED
      - DECLINED
      - CANCELLED
      - COMPLETED
      - EXPIRED
      type: string
      description: |-
        * `PENDING` - Pending
        * `CONFIRMED` - Confirmed
        * `DECLINED` - Declined
        * `CANCELLED` - Cancelled
        * `COMPLETED` - Completed
        * `EXPIRED` - Expired
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        property:
          type: string
          format: uuid
          nullable: true
        stay:
          type: string
          format: uuid
          nullable: true
        subject:
          type: string
          maxLength: 255
        status:
          allOf:
          - $ref: '#/components/schemas/ConversationStatusEnum'
          readOnly: true
        last_message_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_message:
          type: string
          readOnly: true
        unread_count:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - last_message
      - last_message_at
      - status
      - unread_count
    ConversationStatusEnum:
      enum:
      - OPEN
      - ACTIVE
      - CLOSED
      - ARCHIVED
      - BLOCKED
      type: string
      description: |-
        * `OPEN` - Open
        * `ACTIVE` - Active
        * `CLOSED` - Closed
        * `ARCHIVED` - Archived
        * `BLOCKED` - Blocked
    Favourite:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        property:
          type: string
          format: uuid
          nullable: true
        stay:
          type: string
          format: uuid
          nullable: true
        property_card:
          allOf:
          - $ref: '#/components/schemas/PropertyList'
          readOnly: true
        stay_card:
          allOf:
          - $ref: '#/components/schemas/StayList'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - property_card
      - stay_card
    FrequencyEnum:
      enum:
      - INSTANT
      - DAILY
      - WEEKLY
      - 'OFF'
      type: string
      description: |-
        * `INSTANT` - Instant
        * `DAILY` - Daily
        * `WEEKLY` - Weekly
        * `OFF` - Off
    Image:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        image:
          type: string
          format: uri
        caption:
          type: string
          maxLength: 255
        sort_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        is_cover:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - image
    ListingTypeEnum:
      enum:
      - RENT
      - SALE
      type: string
      description: |-
        * `RENT` - For rent
        * `SALE` - For sale
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        notification_type:
          $ref: '#/components/schemas/NotificationTypeEnum'
        title:
          type: string
          maxLength: 200
        message:
          type: string
        data: {}
        is_read:
          type: boolean
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
      - created_at
      - id
      - message
      - notification_type
      - title
    NotificationTypeEnum:
      enum:
      - NEW_MESSAGE
      - GUEST_ENQUIRY
      - VIEWING_REQUEST
      - VIEWING_CONFIRMED
      - VIEWING_RESCHEDULED
      - VIEWING_CANCELLED
      - BOOKING_REQUESTED
      - BOOKING_CONFIRMED
      - BOOKING_DECLINED
      - BOOKING_CANCELLED
      - BOOKING_EXPIRING
      - SAVED_SEARCH_MATCH
      - LISTING_AVAILABILITY_REMINDER
      - LISTING_STATUS_UPDATE
      - VERIFICATION_UPDATE
      - SYSTEM
      type: string
      description: |-
        * `NEW_MESSAGE` - New message
        * `GUEST_ENQUIRY` - Guest enquiry
        * `VIEWING_REQUEST` - Viewing request

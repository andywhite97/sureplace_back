          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        phone_number:
          oneOf:
          - type: string
            pattern: ^\+[1-9]\d{7,14}$
            maxLength: 16
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        avatar:
          type: string
          format: uri
          nullable: true
        is_email_verified:
          type: boolean
          readOnly: true
        is_phone_verified:
          type: boolean
          readOnly: true
        onboarding_intents: {}
        date_joined:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - date_joined
      - email
      - first_name
      - id
      - is_email_verified
      - is_phone_verified
      - last_name
      - updated_at
    VerificationStatusEnum:
      enum:
      - UNVERIFIED
      - PENDING
      - VERIFIED
      - REJECTED
      - SUSPENDED
      type: string
      description: |-
        * `UNVERIFIED` - Unverified
        * `PENDING` - Pending
        * `VERIFIED` - Verified
        * `REJECTED` - Rejected
        * `SUSPENDED` - Suspended
    VerificationTypeEnum:
      enum:
      - IDENTITY
      - AGENT
      - AGENCY
      - PROPERTY
      - STAY
      - BUSINESS
      type: string
      description: |-
        * `IDENTITY` - Identity
        * `AGENT` - Agent
        * `AGENCY` - Agency
        * `PROPERTY` - Property
        * `STAY` - Stay
        * `BUSINESS` - Business
    Viewing:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        requested_date:
          type: string
          format: date
        requested_time:
          type: string
          format: time
        alternative_date:
          type: string
          format: date
          nullable: true
        alternative_time:
          type: string
          format: time
          nullable: true
        notes:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/ViewingStatusEnum'
          readOnly: true
          default: PENDING
        confirmed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        property:
          type: string
          format: uuid
        requester:
          type: string
          format: uuid
          readOnly: true
        agent:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        conversation:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - agent
      - cancelled_at
      - completed_at
      - confirmed_at
      - conversation
      - created_at
      - id
      - property
      - requested_date
      - requested_time
      - requester
      - status
      - updated_at
    ViewingStatusEnum:
      enum:
      - PENDING

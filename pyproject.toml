[tool.black]
line-length = 120
target-version = ["py313"]
extend-exclude = "/migrations/"

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702", "E741", "F403", "F405"]

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "manage.py", "*/tests.py", "*/tests_*.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
